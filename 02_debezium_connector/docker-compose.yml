version: "3.8"
services:
  debezium:
    image: quay.io/debezium/connect:2.7
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: ${KAFKA_BROKER_IP}:${KAFKA_PORT}
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: my_connect_configs_v4
      OFFSET_STORAGE_TOPIC: my_connect_offsets_v4
      STATUS_STORAGE_TOPIC: my_connect_statuses_v4
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
      KAFKA_SERVER: ${KAFKA_SERVER}
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
