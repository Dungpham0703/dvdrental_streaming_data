version: 2

models:
  - name: dim_customer
    description: "SCD Type 2 customer dimension with denormalized address. Multiple rows per customer — use is_current for latest."
    columns:
      - name: customer_key
        description: "Surrogate key (from dbt snapshot dbt_scd_id)"
        tests: [unique, not_null]
      - name: customer_id
        description: "Natural key"
        tests: [not_null]
      - name: email
        tests: [not_null]

  - name: dim_film
    description: "Film dimension with language, category, and actor count"
    columns:
      - name: film_id
        description: "Primary key"
        tests: [unique, not_null]
      - name: title
        tests: [not_null]

  - name: dim_store
    description: "Store dimension with denormalized address and manager name"
    columns:
      - name: store_id
        description: "Primary key"
        tests: [unique, not_null]

  - name: dim_staff
    description: "Staff dimension with denormalized address"
    columns:
      - name: staff_id
        description: "Primary key"
        tests: [unique, not_null]

  - name: dim_actor
    description: "Actor dimension with film count"
    columns:
      - name: actor_id
        description: "Primary key"
        tests: [unique, not_null]

  - name: fct_rental
    description: "Rental fact table enriched with film_id, store_id, and computed rental duration"
    columns:
      - name: rental_id
        description: "Primary key"
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_customer')
              field: customer_id
      - name: staff_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_staff')
              field: staff_id
      - name: rental_date
        tests: [not_null]

  - name: fct_payment
    description: "Payment fact table enriched with film_id and store_id"
    columns:
      - name: payment_id
        description: "Primary key"
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_customer')
              field: customer_id
      - name: amount
        description: "Payment amount — must be positive"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"

  - name: dim_date
    description: "Generated Date Dimension table providing rich calendar context (year, quarter, month, day of week, is_weekend)"
    columns:
      - name: date_key
        description: "Integer date key (YYYYMMDD)"
        tests: [unique, not_null]
      - name: date_day
        description: "Date value"
        tests: [unique, not_null]

  - name: fct_daily_revenue
    description: "Daily aggregated revenue summary per store"
    columns:
      - name: revenue_key
        description: "Surrogate primary key (YYYYMMDD_store_id)"
        tests: [unique, not_null]
      - name: payment_date_day
        tests: [not_null]
      - name: store_id
        tests: [not_null]
      - name: total_revenue
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

