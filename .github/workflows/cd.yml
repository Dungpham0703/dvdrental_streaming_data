name: Data Lakehouse Pipeline CD

on:
  push:
    branches: [main, master]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  detect-changes:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    outputs:
      airflow: ${{ steps.filter.outputs.airflow }}
      hudi: ${{ steps.filter.outputs.hudi }}
      debezium: ${{ steps.filter.outputs.debezium }}
      producer: ${{ steps.filter.outputs.producer }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Paths Filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            airflow:
              - 'pipelines/airflow/**'
              - 'pipelines/dbt/**'
              - '.github/workflows/cd.yml'
            hudi:
              - 'pipelines/hudi/**'
              - 'infra/terraform_multi_node/scripts/run_hudi_streamer_ec2.sh'
              - '.github/workflows/cd.yml'
            debezium:
              - 'infra/docker/debezium/**'
              - '.github/workflows/cd.yml'
            producer:
              - 'infra/terraform_multi_node/producer/**'
              - '.github/workflows/cd.yml'

  # =========================================================================
  # 1. AIRFLOW CI/CD: Build Custom Docker Image, Package DAGs, Deploy to EC2
  # =========================================================================
  build-airflow-image:
    name: Build & Push Airflow Docker Image
    needs: [detect-changes]
    if: needs.detect-changes.outputs.airflow == 'true' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata for Docker Image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/airflow
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./pipelines/airflow
          file: ./pipelines/airflow/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  package-dags:
    name: Package Airflow DAGs Artifact
    needs: [detect-changes]
    if: needs.detect-changes.outputs.airflow == 'true' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Airflow DAGs Bundle
        run: |
          mkdir -p build
          tar -czvf build/airflow-dags.tar.gz -C pipelines/airflow/dags .

      - name: Upload DAGs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: airflow-dags
          path: build/airflow-dags.tar.gz
          retention-days: 7

  deploy-airflow-ec2:
    name: Deploy Airflow to EC2
    needs: [build-airflow-image, package-dags]
    runs-on: ubuntu-latest
    steps:
      - name: Check Deployment Secrets
        id: check-secrets
        run: |
          if [ -z "${{ secrets.EC2_AIRFLOW_HOST }}" ] || [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::notice::EC2_AIRFLOW_HOST or EC2_SSH_KEY not configured. Skipping automated Airflow EC2 deployment."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy via SSH to Airflow EC2
        if: steps.check-secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_AIRFLOW_HOST }}
          username: ${{ secrets.EC2_USER || 'ec2-user' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            set -e
            echo "==> Deploying Airflow to EC2 (${{ github.repository }})..."

            APP_DIR="$HOME/dvdrental_streaming_data"
            if [ ! -d "$APP_DIR" ]; then
              git clone https://github.com/${{ github.repository }}.git "$APP_DIR"
            else
              cd "$APP_DIR"
              git fetch origin main
              git checkout main
              git pull origin main
            fi

            cd "$APP_DIR/pipelines/airflow"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/${{ github.repository }}/airflow:latest
            docker compose pull || true
            docker compose up -d --force-recreate
            echo "==> Airflow deployment completed successfully!"

  # =========================================================================
  # 2. HUDI STREAMER CD: Sync Table Configs, Avro Schemas & Runner to S3
  # =========================================================================
  sync-hudi-configs:
    name: Sync Hudi Configs to S3
    needs: [detect-changes]
    if: needs.detect-changes.outputs.hudi == 'true' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check AWS Credentials
        id: check-aws
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] || [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ] || [ -z "${{ secrets.AWS_S3_BUCKET_NAME }}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::notice::AWS credentials or S3 bucket not configured. Skipping Hudi S3 sync."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS Credentials
        if: steps.check-aws.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-southeast-2' }}

      - name: Sync Hudi Configs & Schemas to S3
        if: steps.check-aws.outputs.configured == 'true'
        run: |
          echo "[*] Syncing Hudi table properties and Avro schemas to S3..."
          aws s3 sync pipelines/hudi/ s3://${{ secrets.AWS_S3_BUCKET_NAME }}/hudi-configs/ --exclude "*.env" --exclude "docker-compose.yml" --delete

          if [ -f "infra/terraform_multi_node/scripts/run_hudi_streamer_ec2.sh" ]; then
            echo "[*] Syncing Hudi EC2 runner script to S3..."
            aws s3 cp infra/terraform_multi_node/scripts/run_hudi_streamer_ec2.sh s3://${{ secrets.AWS_S3_BUCKET_NAME }}/scripts/run_hudi_streamer_ec2.sh
          fi
          echo "==> Hudi configurations successfully synced to S3!"

  # =========================================================================
  # 3. DEBEZIUM CD: Deploy & Update Connectors via REST API / EC2
  # =========================================================================
  deploy-debezium-connectors:
    name: Deploy Debezium Connectors
    needs: [detect-changes]
    if: needs.detect-changes.outputs.debezium == 'true' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Debezium Deployment Secrets
        id: check-secrets
        run: |
          HOST="${{ secrets.EC2_DEBEZIUM_HOST || secrets.EC2_AIRFLOW_HOST }}"
          if [ -z "$HOST" ] || [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::notice::EC2_DEBEZIUM_HOST or EC2_SSH_KEY not configured. Skipping automated Debezium connector deployment."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy Connectors via SSH
        if: steps.check-secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_DEBEZIUM_HOST || secrets.EC2_AIRFLOW_HOST }}
          username: ${{ secrets.EC2_USER || 'ec2-user' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            set -e
            echo "==> Updating Debezium Connectors on EC2..."
            APP_DIR="$HOME/dvdrental_streaming_data"
            if [ -d "$APP_DIR" ]; then
              cd "$APP_DIR"
              git fetch origin main
              git checkout main
              git pull origin main
              cd infra/docker/debezium
              if [ -f "manage_connectors.py" ]; then
                echo "[*] Applying connector configurations to Debezium..."
                python3 manage_connectors.py || true
              fi
            fi
            echo "==> Debezium connectors update step completed!"

  # =========================================================================
  # 4. KAFKA PRODUCER CD: Sync Producer Script to S3 & EC2 Node
  # =========================================================================
  deploy-producer:
    name: Deploy Kafka Producer Script
    needs: [detect-changes]
    if: needs.detect-changes.outputs.producer == 'true' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check AWS Credentials
        id: check-aws
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] || [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ] || [ -z "${{ secrets.AWS_S3_BUCKET_NAME }}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Sync Producer Script to S3
        if: steps.check-aws.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-southeast-2' }}

      - name: Upload Producer Script to S3
        if: steps.check-aws.outputs.configured == 'true'
        run: |
          echo "[*] Syncing producer script to S3..."
          aws s3 cp infra/terraform_multi_node/producer/producer.py s3://${{ secrets.AWS_S3_BUCKET_NAME }}/scripts/producer.py
          echo "==> Producer script synced to S3!"

      - name: Deploy Producer via SSH
        if: secrets.EC2_PRODUCER_HOST != '' && secrets.EC2_SSH_KEY != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_PRODUCER_HOST }}
          username: ${{ secrets.EC2_USER || 'ec2-user' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            echo "==> Updating Producer on EC2..."
            mkdir -p ~/producer
            curl -sSL "https://${{ secrets.AWS_S3_BUCKET_NAME }}.s3.amazonaws.com/scripts/producer.py" -o ~/producer/producer.py || true
            echo "==> Producer script updated!"
