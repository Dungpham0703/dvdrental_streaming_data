repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--unsafe"]
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=5000"]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix]
        exclude: ^(apps/ai_agent/|apps/ai_dashboard/|scripts/experiments/|infra/terraform_multi_node/producer/)
      - id: ruff-format
        exclude: ^(apps/ai_agent/|apps/ai_dashboard/|scripts/experiments/|infra/terraform_multi_node/producer/)

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck
