version: 2

models:
  - name: int_full_address
    description: "Denormalized address view joining address + city + country"
    columns:
      - name: address_id
        description: "Primary key — from stg_address"
        tests: [unique, not_null]

  - name: int_film_details
    description: "Enriched film view with language and category names"
    columns:
      - name: film_id
        description: "Primary key — from stg_film"
        tests: [unique, not_null]

  - name: int_customer_rental_summary
    description: "Aggregated customer rental behavior metrics (first/last dates, total rentals, total spend)"
    columns:
      - name: customer_id
        description: "Primary key — FK to stg_customer"
        tests: [unique, not_null]
