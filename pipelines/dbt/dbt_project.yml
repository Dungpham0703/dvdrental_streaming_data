name: "dvdrental_lakehouse"
version: "1.0.0"
profile: "dvdrental_athena_dzung"

model-paths: ["models"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
clean-targets: ["target", "dbt_packages"]

models:
  dvdrental_lakehouse:
    staging:
      +materialized: table
      +table_type: iceberg
      +format: parquet
      +tags: ["silver"]
      +schema: staging
    intermediate:
      +materialized: view
      +tags: ["silver"]
      +schema: intermediate
    mart:
      +materialized: table
      +table_type: iceberg
      +format: parquet
      +tags: ["gold"]
      +schema: mart

seeds:
  dvdrental_lakehouse:
    +schema: dvdrental_mart
    +table_type: iceberg

snapshots:
  dvdrental_lakehouse:
    +table_type: iceberg
    +strategy: timestamp
    +schema: dvdrental_snapshot

tests:
  +store_failures: true
  +table_type: iceberg
  +schema: audit
