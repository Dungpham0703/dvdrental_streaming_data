hoodie.datasource.write.table.type=MERGE_ON_READ
hoodie.datasource.write.operation=upsert

hoodie.datasource.write.partitionpath.field=
hoodie.datasource.write.keygenerator.class=org.apache.hudi.keygen.NonpartitionedKeyGenerator

hoodie.datasource.write.payload.class=org.apache.hudi.common.model.debezium.PostgresDebeziumAvroPayload

auto.offset.reset=earliest
hoodie.streamer.source.class=org.apache.hudi.utilities.sources.JsonKafkaSource
hoodie.streamer.schemaprovider.class=org.apache.hudi.utilities.schema.FilebasedSchemaProvider

hoodie.compact.inline=false
hoodie.compact.inline.max.delta.commits=5

hoodie.streamer.ingestion.tablesToBeIngested=public.actor,public.address,public.category,public.city,public.country,public.customer,public.film,public.film_actor,public.film_category,public.inventory,public.language,public.payment,public.rental,public.staff,public.store

