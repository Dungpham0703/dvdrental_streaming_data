hoodie.datasource.write.table.type=MERGE_ON_READ
hoodie.datasource.write.operation=upsert

hoodie.datasource.write.partitionpath.field=
hoodie.datasource.write.keygenerator.class=org.apache.hudi.keygen.NonpartitionedKeyGenerator
hoodie.datasource.write.precombine.field=__ts_ms

# hoodie.datasource.write.payload.class=org.apache.hudi.common.model.debezium.PostgresDebeziumAvroPayload

auto.offset.reset=earliest
hoodie.streamer.source.class=org.apache.hudi.utilities.sources.JsonKafkaSource
hoodie.streamer.schemaprovider.class=org.apache.hudi.utilities.schema.FilebasedSchemaProvider

hoodie.compact.inline=true
hoodie.compact.inline.max.delta.commits=5

hoodie.clean.automatic=true
hoodie.cleaner.policy=KEEP_LATEST_COMMITS
hoodie.cleaner.commits.retained=1

hoodie.streamer.ingestion.tablesToBeIngested=actor,address,category,city,country,customer,film,film_actor,film_category,inventory,language,payment,rental,staff,store

hoodie.streamer.ingestion.default.actor.configFile=/opt/hudi-configs/tables/actor.properties
hoodie.streamer.ingestion.default.address.configFile=/opt/hudi-configs/tables/address.properties
hoodie.streamer.ingestion.default.category.configFile=/opt/hudi-configs/tables/category.properties
hoodie.streamer.ingestion.default.city.configFile=/opt/hudi-configs/tables/city.properties
hoodie.streamer.ingestion.default.country.configFile=/opt/hudi-configs/tables/country.properties
hoodie.streamer.ingestion.default.customer.configFile=/opt/hudi-configs/tables/customer.properties
hoodie.streamer.ingestion.default.film.configFile=/opt/hudi-configs/tables/film.properties
hoodie.streamer.ingestion.default.film_actor.configFile=/opt/hudi-configs/tables/film_actor.properties
hoodie.streamer.ingestion.default.film_category.configFile=/opt/hudi-configs/tables/film_category.properties
hoodie.streamer.ingestion.default.inventory.configFile=/opt/hudi-configs/tables/inventory.properties
hoodie.streamer.ingestion.default.language.configFile=/opt/hudi-configs/tables/language.properties
hoodie.streamer.ingestion.default.payment.configFile=/opt/hudi-configs/tables/payment.properties
hoodie.streamer.ingestion.default.rental.configFile=/opt/hudi-configs/tables/rental.properties
hoodie.streamer.ingestion.default.staff.configFile=/opt/hudi-configs/tables/staff.properties
hoodie.streamer.ingestion.default.store.configFile=/opt/hudi-configs/tables/store.properties

