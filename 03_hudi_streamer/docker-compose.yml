version: "3.8"

services:
  hudi-streamer:
    image: apache/spark:3.5.0
    container_name: hudi-streamer-multi
    user: root
    environment:
      - KAFKA_BROKER_IP=${KAFKA_BROKER_IP}
      - KAFKA_PORT=${KAFKA_PORT}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
    volumes:
      - ./:/opt/hudi-configs
    entrypoint: >
      /bin/bash -c "
      echo 'Initializing Apache Hudi MultiTableStreamer for all tables...' &&
      cp /opt/hudi-configs/common.properties /tmp/common.properties &&
      echo 'bootstrap.servers='$${KAFKA_BROKER_IP}':'$${KAFKA_PORT} >> /tmp/common.properties &&
      /opt/spark/bin/spark-submit \
        --class org.apache.hudi.utilities.streamer.HoodieMultiTableStreamer \
        --packages org.apache.hudi:hudi-spark3.5-bundle_2.12:0.15.0,org.apache.hudi:hudi-utilities-bundle_2.12:0.15.0,org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.261 \
        --master 'local[2]' \
        --conf spark.serializer=org.apache.spark.serializer.KryoSerializer \
        --conf spark.sql.hive.convertMetastoreParquet=false \
        --conf spark.hadoop.fs.s3a.access.key=$${AWS_ACCESS_KEY_ID} \
        --conf spark.hadoop.fs.s3a.secret.key=$${AWS_SECRET_ACCESS_KEY} \
        --conf spark.hadoop.fs.s3a.endpoint=s3.$${AWS_REGION}.amazonaws.com \
        --conf spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem \
        --conf spark.hadoop.fs.s3a.path.style.access=true \
        /opt/spark/jars/spark-core_2.12-3.5.0.jar \
        --props /tmp/common.properties \
        --config-folder /opt/hudi-configs/tables \
        --base-path-prefix s3a://$${S3_BUCKET_NAME}/hudi/ \
        --source-class org.apache.hudi.utilities.sources.debezium.PostgresDebeziumSource \
        --source-ordering-field ts_ms \
        --target-table-type MERGE_ON_READ \
        --op UPSERT \
        --continuous \
        --min-sync-interval-seconds 10
      "
