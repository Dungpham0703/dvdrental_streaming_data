version: "3.8"

services:
  hudi-streamer:
    image: apache/spark:3.5.0
    container_name: hudi-streamer-multi
    user: root
    environment:
      - KAFKA_BROKER_IP=${KAFKA_BROKER_IP}
      - KAFKA_PORT=${KAFKA_PORT}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
    volumes:
      - ./:/opt/hudi-configs
    entrypoint: >
      /bin/bash -c "
      echo 'Initializing Apache Hudi MultiTableStreamer for all tables...' &&
      cp /opt/hudi-configs/common.properties /tmp/common.properties &&
      echo 'bootstrap.servers='$${KAFKA_BROKER_IP}':'$${KAFKA_PORT} >> /tmp/common.properties &&
      spark-submit \
      --class org.apache.hudi.utilities.streamer.HoodieMultiTableStreamer \
      --packages org.apache.hudi:hudi-spark3.5-bundle_2.12:0.15.0,org.apache.hudi:hudi-utilities-bundle_2.12:0.15.0,org.apache.hadoop:hadoop-aws:3.3.4 \
      --master "local[2]" \
      --driver-memory 2g \
      --executor-memory 2g \
      /root/.ivy2/jars/org.apache.hudi_hudi-utilities-bundle_2.12-0.15.0.jar \
      --config-folder /path/to/tables \
      --base-path-prefix s3a://dvdrental-datalake/bronze/ \
      --props /path/to/common.properties \
      --continuous
      "
